<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Payas Goyal Portfolio">
    
    <title>404 - Page Not Found | Payas Goyal</title>
    
    <!-- Favicon -->
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        body {
            overflow: hidden;
        }
        
        .error-page {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .error-content {
            max-width: 600px;
            padding: 0 20px;
        }
        
        .error-number {
            font-size: 15rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            line-height: 1;
            position: relative;
        }
        
        .error-number::after {
            content: "";
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 5px;
            background-color: var(--primary-color);
            border-radius: 5px;
        }
        
        .error-content h2 {
            margin-bottom: 2rem;
            font-size: 3.5rem;
        }
        
        .error-content p {
            margin-bottom: 3rem;
            font-size: 1.8rem;
        }
        
        .decoration {
            position: absolute;
            font-size: 25rem;
            opacity: 0.03;
            z-index: -1;
        }
        
        .decoration-1 {
            top: -50px;
            left: -50px;
            transform: rotate(-20deg);
        }
        
        .decoration-2 {
            bottom: -50px;
            right: -50px;
            transform: rotate(20deg);
        }
    </style>
</head>
<body>
    <span class="decoration decoration-1">{</span>
    <span class="decoration decoration-2">}</span>
    
    <div class="error-page">
        <div class="error-content">
            <div class="error-number">404</div>
            <h2>Page Not Found</h2>
            <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <a href="index.html" class="btn primary-btn">Back to Home</a>
        </div>
    </div>
</body>
</html>
